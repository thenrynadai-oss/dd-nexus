<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #07070c;
    color: #e8e3d6;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .bg-stage {
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(ellipse 1200px 800px at 12% 8%, rgba(186, 120, 50, 0.18), transparent 60%),
      radial-gradient(ellipse 900px 700px at 88% 92%, rgba(72, 38, 120, 0.32), transparent 60%),
      radial-gradient(ellipse 700px 500px at 50% 50%, rgba(40, 22, 60, 0.4), transparent 70%),
      linear-gradient(180deg, #0a0712 0%, #060509 100%);
    overflow: hidden;
  }
  .bg-stage::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,220,170,0.6), transparent),
      radial-gradient(1px 1px at 30% 80%, rgba(255,220,170,0.4), transparent),
      radial-gradient(1px 1px at 60% 10%, rgba(255,220,170,0.5), transparent),
      radial-gradient(1.5px 1.5px at 80% 60%, rgba(255,220,170,0.3), transparent),
      radial-gradient(1px 1px at 45% 45%, rgba(255,220,170,0.5), transparent),
      radial-gradient(1px 1px at 90% 30%, rgba(255,220,170,0.4), transparent),
      radial-gradient(1.5px 1.5px at 15% 70%, rgba(255,220,170,0.4), transparent),
      radial-gradient(1px 1px at 70% 85%, rgba(255,220,170,0.3), transparent);
    background-size: 100% 100%;
    opacity: 0.7;
    animation: twinkle 8s ease-in-out infinite;
  }
  .bg-stage::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(218, 165, 90, 0.05), transparent 40%),
      radial-gradient(circle at 75% 70%, rgba(120, 80, 200, 0.06), transparent 50%);
    filter: blur(40px);
    animation: drift 18s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 0.85; }
  }
  @keyframes drift {
    0%, 100% { transform: translate(0,0); }
    50% { transform: translate(20px, -15px); }
  }

  /* Glass surfaces */
  .glass {
    background: linear-gradient(180deg, rgba(35, 28, 50, 0.55) 0%, rgba(20, 15, 32, 0.65) 100%);
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    border: 1px solid rgba(218, 180, 120, 0.12);
    box-shadow:
      0 0 0 1px rgba(255, 240, 210, 0.02) inset,
      0 1px 0 rgba(255, 240, 210, 0.06) inset,
      0 20px 60px -20px rgba(0,0,0, 0.7);
  }
  .glass-strong {
    background: linear-gradient(180deg, rgba(45, 36, 64, 0.78) 0%, rgba(24, 18, 38, 0.82) 100%);
    backdrop-filter: blur(28px) saturate(1.6);
    -webkit-backdrop-filter: blur(28px) saturate(1.6);
    border: 1px solid rgba(218, 180, 120, 0.14);
  }
  .glass-soft {
    background: rgba(255, 245, 220, 0.03);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(218, 180, 120, 0.08);
  }

  /* Typography */
  .serif { font-family: 'Cormorant Garamond', serif; letter-spacing: 0.01em; }
  .mono { font-family: 'JetBrains Mono', monospace; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(218, 180, 120, 0.15); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(218, 180, 120, 0.3); }

  /* Selection */
  ::selection { background: rgba(218, 165, 90, 0.4); color: #fff; }

  /* Utility */
  .gold { color: #d8a25a; }
  .gold-bright { color: #f0c170; }
  .ember { color: #c8643a; }
  .arcane { color: #9d7bd8; }
  .leaf { color: #7ba85d; }
  .frost { color: #6da5c8; }
  .blood { color: #c25555; }

  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; }

  @keyframes float-soft {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  .float-soft { animation: float-soft 6s ease-in-out infinite; }

  @keyframes glow-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(218, 165, 90, 0.5); }
    50% { box-shadow: 0 0 30px 8px rgba(218, 165, 90, 0.15); }
  }

  @keyframes roll-spin {
    0% { transform: rotate(0deg) scale(0.8); opacity: 0; }
    50% { transform: rotate(360deg) scale(1.1); opacity: 1; }
    100% { transform: rotate(720deg) scale(1); opacity: 1; }
  }

  #root { min-height: 100vh; }
</style>

<script>
  (function(){
    try {
      var t = localStorage.getItem('theme') || 'default';
      document.body.setAttribute('data-theme', t);
    } catch(e){}
  })();
