    points="96,52 101.7,76.7 127.1,62.9 112.3,84.4 140,96 112.3,107.6 127.1,129.1 101.7,115.3 96,140 90.3,115.3 64.9,129.1 79.7,107.6 52,96 79.7,84.4 64.9,62.9 90.3,76.7"
