  <line x1="96" y1="96" x2="96" y2="52"  stroke="#f0c84a" stroke-width="0.7" opacity="0.6"/>
  <line x1="96" y1="96" x2="140" y2="96" stroke="#f0c84a" stroke-width="0.7" opacity="0.6"/>
  <line x1="96" y1="96" x2="96" y2="140" stroke="#f0c84a" stroke-width="0.7" opacity="0.6"/>
  <line x1="96" y1="96" x2="52" y2="96"  stroke="#f0c84a" stroke-width="0.7" opacity="0.6"/>
  <circle cx="96" cy="96" r="7" fill="#f0c84a" opacity="0.15"/>
